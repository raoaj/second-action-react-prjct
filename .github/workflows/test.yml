name: Test NodeJs Project
on: 
  push:
    branches:
      - dev
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses : actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with: 
          node-version: 18
      - name: Install dependencies    
        run: npm ci 
      - name: Run Tests
        run: npm test  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses : actions/checkout@v3
      - name: Install dependencies    
        run: npm ci 
      - name: build website
        run: npm run build
      - name: upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path:  |
            dist
            package.json
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses : actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with: 
          node-version: 18
      - name: Install dependencies    
        run: npm ci 
      - name: Build Project
        run: npm run build
      - name: deploy
        run: echo "Deployed"
